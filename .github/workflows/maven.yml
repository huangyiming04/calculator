# Name shown in the Actions tab and next to the status badge.
name: Java CI

# Trigger: every push to any branch, and every pull request.
on:
  push:
  pull_request:

jobs:
  build:
    # GitHub-hosted Linux runner.
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository into the runner workspace.
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Install the JDK the project targets and cache the Maven repository
      #    so later runs do not download the dependencies again.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 3. Compile the main sources; a syntax or type error stops the run here.
      - name: Compile the sources
        run: mvn -B -ntp clean compile

      # 4. Compile and run every JUnit 5 test; a failed assertion stops the run here.
      - name: Run the JUnit tests
        run: mvn -B -ntp test

  # 5. Container job: builds the image from the Dockerfile and proves that
  #    the calculator still works inside it. It starts only after "build"
  #    is green, so a broken test never produces a published image.
  docker:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Change this if your Docker Hub account name differs from GitHub.
      IMAGE_NAME: huangyiming04/calculator

    steps:
      # 1. Dockerfile, pom.xml and src/ must be in the workspace.
      - name: Check out the repository
        uses: actions/checkout@v4

      # 2. Same multi-stage build as on a laptop; the runner has Docker
      #    preinstalled, so no setup step is needed.
      - name: Build the Docker image
        run: docker build -t "$IMAGE_NAME:lab6" .

      # 3. Run the container like a user would. Exit code 1 (test fails)
      #    marks the job red, which is the CI equivalent of the local run.
      - name: Run the calculator inside the image
        run: |
          result=$(docker run --rm "$IMAGE_NAME:lab6" 2 + 2)
          echo "2 + 2 = $result"
          test "$result" = "4.0"

      # 4. Evidence for the Actions log.
      - name: Show the built image
        run: docker image ls "$IMAGE_NAME"

      # 5. Publish only on main: pull requests build and test, merges ship.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_NAME:lab6"
