# Site served by the nginx container.
server {
    listen 80;
    server_name _;

    # The static files copied into the image by the Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Any other path falls back to the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The reverse proxy. "backend" is the compose service name: Docker's
    # internal DNS resolves it, which a browser on the host could never do.
    # No trailing slash on proxy_pass, so the /api/ prefix is kept and the
    # backend receives exactly the path it registers.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast instead of leaving the browser waiting when the backend
        # is down or still starting.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
